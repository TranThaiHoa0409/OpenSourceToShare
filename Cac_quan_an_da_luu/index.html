<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Quán Ăn — Danh sách đã lưu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Giao diện riêng, nạp SAU Bootstrap để override -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container wrap py-5">

  <header class="d-flex justify-content-between align-items-end flex-wrap gap-3 pb-3 mb-2 border-bottom border-3">
    <div>
      <p class="kicker mb-1">Sổ tay cá nhân</p>
      <h1 class="mb-0">Quán Ăn Đã Lưu</h1>
    </div>
    <div class="meta text-sm-end small">
      <div><strong id="count-visible">0</strong> quán đang hiển thị</div>
      <div>Cập nhật gần nhất: tháng 8, 2026</div>
    </div>
  </header>

  <div class="controls d-flex justify-content-between align-items-center flex-wrap gap-2 my-4">
    <ul class="nav nav-pills gap-1" id="tabs"></ul>

    <div class="input-group input-group-sm search-group">
      <span class="input-group-text">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </span>
      <input id="search-input" type="text" class="form-control" placeholder="Tìm theo tên, quận...">
    </div>
  </div>

  <div class="ledger table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th data-key="name" scope="col">Quán <span class="arrow">▾</span></th>
          <th data-key="category" scope="col">Loại <span class="arrow">▾</span></th>
          <th data-key="address" scope="col">Địa chỉ <span class="arrow">▾</span></th>
          <th data-key="hours" scope="col">Giờ mở cửa <span class="arrow">▾</span></th>
          <th data-key="phone" scope="col">Liên hệ <span class="arrow">▾</span></th>
          <th data-key="note" scope="col">Ghi chú</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <footer class="text-center small mt-4">Nhấn vào tiêu đề cột để sắp xếp · Nguồn: OpenSourceToShare</footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
